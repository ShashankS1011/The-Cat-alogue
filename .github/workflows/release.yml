name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "THE_CAT_API_KEY=live_pAAbxB0S79QEhi9f122NsmHhuo7PgncwMptCEPDi9yTdubmufGFTitiXsKlrQbik" >> local.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Copy APK for Upload
        run: |
          mkdir -p output_apks
          cp app/build/outputs/apk/release/app-release-unsigned.apk output_apks/TheCat-alogue-${{ github.ref_name }}.apk || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TheCat-alogue-Release-APK
          path: output_apks/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "The Cat-alogue ${{ github.ref_name }}"
          body: |
            ## The Cat-alogue Release ${{ github.ref_name }}
            
            ### Highlights:
            - **100% Kotlin Architecture**: Coroutines, StateFlow, and Room KTX offline caching.
            - **Material 3 Design & Dynamic Colors**: Adaptive theme palette with high contrast.
            - **Interactive Features**: AutoComplete breed search, pinch-to-zoom image viewer, shake-to-refresh, and TTS daily cat facts.
            - **Downloads & File Sharing**: Direct image/GIF downloads and secure FileProvider sharing.
            
            ---
            ### Downloads
            Download the main release `.apk` file below and install it directly on your Android device (Android 7.0+ / API 24+).
          draft: false
          prerelease: false
          files: output_apks/*
